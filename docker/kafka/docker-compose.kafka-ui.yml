# Kafka-ui: interfaz web para administrar brokers, tópicos y consumer groups.
# Requisito: el clúster Kafka debe estar arriba (docker-compose.kafka.yml), porque comparten la red "kafka-net".
# Uso:   docker compose -f docker-compose.kafka-ui.yml up -d
# Web:   http://localhost:8085      (el 8080 queda libre para el backend)

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
    name: kafka-net
