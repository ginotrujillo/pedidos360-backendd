# RabbitMQ local de un solo nodo, para desarrollo.
# Uso:  docker compose -f docker-compose.local.yml up -d
# Management UI: http://localhost:15672   (usuario admin / clave admin123, SOLO para desarrollo local)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
